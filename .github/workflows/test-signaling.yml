name: Test Recovered Signaling & Build Baseline

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: recovered_source/webrtc-signaling

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: recovered_source/webrtc-signaling/go.sum

      - name: Show Go version
        run: go version

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Run Agent Authentication Matrix (Fail-Closed)
        run: |
          set -euo pipefail
          test -f agent_auth_test.go
          go test -v -count=1 -timeout 60s -run '^(TestExtractAgentCredential|TestAgentCredentialValidationMatrix)$' . | tee /tmp/agent-auth-matrix.log
          grep -q -- '--- PASS: TestExtractAgentCredential' /tmp/agent-auth-matrix.log
          grep -q -- '--- PASS: TestAgentCredentialValidationMatrix' /tmp/agent-auth-matrix.log
          ! grep -q -- '--- FAIL:' /tmp/agent-auth-matrix.log
          echo 'AUTH_MATRIX=PASS'

      - name: Run Real WSS Agent Authentication Integration Gate (Fail-Closed)
        run: |
          set -euo pipefail
          test -f agent_wss_integration_test.go
          go test -v -count=1 -timeout 90s -run '^TestAgentWSSIntegration' . | tee /tmp/agent-wss-integration.log
          grep -q -- '--- PASS: TestAgentWSSIntegrationBearerRegistration' /tmp/agent-wss-integration.log
          grep -q -- '--- PASS: TestAgentWSSIntegrationWrongBearerRejected' /tmp/agent-wss-integration.log
          grep -q -- '--- PASS: TestAgentWSSIntegrationMissingCredentialRejected' /tmp/agent-wss-integration.log
          grep -q -- '--- PASS: TestAgentWSSIntegrationLegacyTokenRegistration' /tmp/agent-wss-integration.log
          grep -q -- '--- PASS: TestAgentWSSIntegrationBearerPreventsQueryDowngrade' /tmp/agent-wss-integration.log
          ! grep -q -- '--- FAIL:' /tmp/agent-wss-integration.log
          echo 'WSS_AUTH_INTEGRATION=PASS'

      - name: Publish Real WSS Integration Summary
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          {
            echo '## Real WSS Agent Authentication Integration'
            echo
            if [ -f /tmp/agent-wss-integration.log ]; then
              if grep -q -- '--- PASS: TestAgentWSSIntegrationBearerRegistration' /tmp/agent-wss-integration.log && \
                 grep -q -- '--- PASS: TestAgentWSSIntegrationWrongBearerRejected' /tmp/agent-wss-integration.log && \
                 grep -q -- '--- PASS: TestAgentWSSIntegrationMissingCredentialRejected' /tmp/agent-wss-integration.log && \
                 grep -q -- '--- PASS: TestAgentWSSIntegrationLegacyTokenRegistration' /tmp/agent-wss-integration.log && \
                 grep -q -- '--- PASS: TestAgentWSSIntegrationBearerPreventsQueryDowngrade' /tmp/agent-wss-integration.log && \
                 ! grep -q -- '--- FAIL:' /tmp/agent-wss-integration.log; then
                echo '**Result: PASS**'
              else
                echo '**Result: FAIL**'
              fi
              echo
              echo '```text'
              grep -E -- '--- (PASS|FAIL): TestAgentWSSIntegration' /tmp/agent-wss-integration.log || true
              echo '```'
            else
              echo '**Result: NOT RUN / FAILED BEFORE TEST OUTPUT**'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run Full Signaling Test Suite
        run: |
          set -euo pipefail
          go test ./... -v -count=1 | tee /tmp/signaling-tests.log

      - name: Publish Authentication Matrix Summary
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          {
            echo '## Agent Authentication Matrix'
            echo
            if [ -f /tmp/agent-auth-matrix.log ]; then
              if grep -q -- '--- PASS: TestExtractAgentCredential' /tmp/agent-auth-matrix.log && \
                 grep -q -- '--- PASS: TestAgentCredentialValidationMatrix' /tmp/agent-auth-matrix.log && \
                 ! grep -q -- '--- FAIL:' /tmp/agent-auth-matrix.log; then
                echo '**Result: PASS**'
              else
                echo '**Result: FAIL**'
              fi
              echo
              echo '```text'
              grep -E -- '--- (PASS|FAIL): (TestExtractAgentCredential|TestAgentCredentialValidationMatrix)' /tmp/agent-auth-matrix.log || true
              echo '```'
            else
              echo '**Result: NOT RUN / FAILED BEFORE TEST OUTPUT**'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Download Stable Binaries Package
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ secrets.BINARIES_TOKEN }}
        run: |
          echo "Downloading original cloudphone-binaries-v041.zip from private repo..."
          gh release download binaries-v041 -R mood-ahmad/curbox-scrcpy-binaries -p "cloudphone-binaries-v041.zip" -O cloudphone-binaries-v041.zip

      - name: Inspect v0.4.1 Agent Binaries (Fail-Closed)
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          rm -rf /tmp/cloudphone-v041-inspect
          mkdir -p /tmp/cloudphone-v041-inspect
          unzip -q cloudphone-binaries-v041.zip -d /tmp/cloudphone-v041-inspect

          find /tmp/cloudphone-v041-inspect -type f -name 'cloudphone-agent*' -print | sort | tee /tmp/v041-agent-paths.txt
          test -s /tmp/v041-agent-paths.txt || { echo 'ERROR: no cloudphone-agent binaries found'; exit 1; }

          : > /tmp/v041-agent-inventory.txt
          while IFS= read -r f; do
            printf 'PATH=%s\n' "$f" >> /tmp/v041-agent-inventory.txt
            file "$f" >> /tmp/v041-agent-inventory.txt
            sha256sum "$f" >> /tmp/v041-agent-inventory.txt
            echo >> /tmp/v041-agent-inventory.txt
          done < /tmp/v041-agent-paths.txt
          cat /tmp/v041-agent-inventory.txt

          AGENT_BIN=''
          while IFS= read -r f; do
            desc=$(file -b "$f")
            case "$desc" in
              *ELF*64-bit*x86-64*) AGENT_BIN="$f"; break ;;
            esac
          done < /tmp/v041-agent-paths.txt

          test -n "$AGENT_BIN" || { echo 'ERROR: no Linux ELF x86-64 cloudphone-agent found'; exit 1; }
          chmod +x "$AGENT_BIN"
          printf '%s\n' "$AGENT_BIN" > /tmp/v041-agent-bin-path.txt

          set +e
          "$AGENT_BIN" -help > /tmp/v041-agent-help.txt 2>&1
          HELP_RC=$?
          set -e
          cat /tmp/v041-agent-help.txt
          grep -q -- '-device-secret' /tmp/v041-agent-help.txt || { echo 'ERROR: v0.4.1 Agent does not expose -device-secret'; exit 1; }
          grep -q -- 'CloudPhone Fat Agent v0.4.1' /tmp/v041-agent-help.txt || echo "NOTE: version banner not present in -help output (rc=$HELP_RC); runtime gate will verify behaviour instead"
          echo 'V041_AGENT_CONTRACT=PASS'

      - name: Publish v0.4.1 Agent Inventory Summary
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          {
            echo '## CloudPhone Agent v0.4.1 Binary Inventory'
            echo
            if [ -f /tmp/v041-agent-inventory.txt ]; then
              echo '```text'
              cat /tmp/v041-agent-inventory.txt
              echo '```'
            else
              echo '**Result: inventory unavailable**'
            fi
            if [ -f /tmp/v041-agent-bin-path.txt ]; then
              echo
              echo '**Linux x86-64 candidate: FOUND**'
            else
              echo
              echo '**Linux x86-64 candidate: NOT FOUND**'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build Linux test signaling
        run: go build -v -o webrtc-signaling-test .

      - name: Verify Linux test binary
        run: |
          test -s webrtc-signaling-test
          file webrtc-signaling-test
          ls -lh webrtc-signaling-test

      # ==========================================
      # NEW: Real Server Verification Step
      # ==========================================
      - name: Verify Server Starts and Responds to HTTPS
        run: |
          echo "=== Generating temporary TLS certificates ==="
          mkdir -p /tmp/test-certs
          openssl req -x509 -newkey rsa:4096 -keyout /tmp/test-certs/server.key -out /tmp/test-certs/server.crt -days 1 -nodes -subj "/CN=localhost" 2>/dev/null

          echo "=== Starting the server in the background ==="
          # We use DEV_MODE=true to bypass the secret requirement for this test
          export DEV_MODE=true
          export DATA_DIR=/tmp/test-data
          mkdir -p $DATA_DIR

          ./webrtc-signaling-test -port 9443 -cert /tmp/test-certs/server.crt -key /tmp/test-certs/server.key -data $DATA_DIR > /tmp/test-server.log 2>&1 &
          SERVER_PID=$!

          echo "=== Waiting for server to become ready ==="
          READY=0
          for i in $(seq 1 20); do
            if grep -q "Listening on" /tmp/test-server.log; then
              READY=1
              break
            fi
            sleep 1
          done

          if [ "$READY" -ne 1 ]; then
            echo "❌ FAILED: Server did not print 'Listening on' within 20 seconds."
            echo "--- Server Log ---"
            cat /tmp/test-server.log
            kill -9 $SERVER_PID || true
            exit 1
          fi
          echo "✅ Server printed 'Listening on'."

          echo "=== Verifying server responds to HTTPS requests ==="
          # -k ignores self-signed cert, -s silent, -o /dev/null discard body, -w "%{http_code}" print status
          HTTP_STATUS=$(curl -k -s -o /dev/null -w "%{http_code}" https://127.0.0.1:9443/)
          
          echo "Server returned HTTP Status: $HTTP_STATUS"

          if [ "$HTTP_STATUS" -eq 200 ] || [ "$HTTP_STATUS" -eq 401 ] || [ "$HTTP_STATUS" -eq 404 ]; then
            echo "✅ SUCCESS: Server is up and responding to HTTP requests."
          else
            echo "❌ FAILED: Server did not return a valid HTTP response."
            echo "--- Server Log ---"
            cat /tmp/test-server.log
            kill -9 $SERVER_PID || true
            exit 1
          fi

          echo "=== Stopping the test server ==="
          kill -15 $SERVER_PID || true
          sleep 1
          # Force kill if still running
          kill -9 $SERVER_PID || true
          
          echo "=== Verification Complete ==="
      # ==========================================

      - name: Upload Linux test binary
        uses: actions/upload-artifact@v4
        with:
          name: recovered-webrtc-signaling-test
          path: recovered_source/webrtc-signaling/webrtc-signaling-test
          if-no-files-found: error

      - name: Check Android ARM64 target
        run: |
          echo "Checking Go target support..."
          go tool dist list | grep -Fx "android/arm64"

      - name: Build Android ARM64 signaling
        env:
          CGO_ENABLED: '0'
          GOOS: android
          GOARCH: arm64
        run: |
          go build -v \
            -trimpath \
            -o webrtc-signaling-android-arm64 \
            .

      - name: Verify Android ARM64 binary
        run: |
          test -s webrtc-signaling-android-arm64
          echo "===== File info ====="
          file webrtc-signaling-android-arm64
          echo ""
          echo "===== Size ====="
          ls -lh webrtc-signaling-android-arm64
          echo ""
          echo "===== SHA-256 ====="
          sha256sum webrtc-signaling-android-arm64

      - name: Upload Android ARM64 signaling
        uses: actions/upload-artifact@v4
        with:
          name: recovered-webrtc-signaling-android-arm64
          path: recovered_source/webrtc-signaling/webrtc-signaling-android-arm64
          if-no-files-found: error

      # ==========================================
      # Baseline Packaging Steps
      # ==========================================

      - name: Extract, Replace, and Repackage
        working-directory: ${{ github.workspace }}
        run: |
          echo "=== Extracting original package ==="
          mkdir -p extracted-binaries
          unzip -q cloudphone-binaries-v041.zip -d extracted-binaries

          echo "=== Searching for existing signaling binary ==="
          OLD_BIN=$(find extracted-binaries -type f -name "webrtc-signaling*" ! -name "*test*" | head -n 1)

          if [ -z "$OLD_BIN" ]; then
            echo "❌ Could not find old signaling binary in the package!"
            echo "=== Files inside the zip ==="
            find extracted-binaries -type f | head -n 50
            exit 1
          fi

          echo "✅ Found old binary at: $OLD_BIN"

          echo "=== Replacing binary ==="
          cp recovered_source/webrtc-signaling/webrtc-signaling-android-arm64 "$OLD_BIN"
          chmod +x "$OLD_BIN"

          echo "=== Repacking ==="
          cd extracted-binaries
          zip -r -q ../cloudphone-binaries-v041-recovered-baseline.zip .
          cd ..

          echo "=== New package created ==="
          ls -lh cloudphone-binaries-v041-recovered-baseline.zip

      - name: Upload Recovered Baseline Package
        uses: actions/upload-artifact@v4
        with:
          name: cloudphone-binaries-v041-recovered-baseline
          path: cloudphone-binaries-v041-recovered-baseline.zip
          if-no-files-found: error